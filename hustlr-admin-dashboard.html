<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    * { font-family: 'Manrope', sans-serif; box-sizing: border-box; }
    body { background: #0A0B0A; color: #E1E3DE; margin: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111311; }
    ::-webkit-scrollbar-thumb { background: #3FFF8B33; border-radius: 3px; }

    .bg-mint { background: #3FFF8B; }
    .border-mint { border-color: #3FFF8B; }
    .tab-active { background: #3FFF8B22; border-color: #3FFF8B; color: #3FFF8B; }
    .tab-inactive { background: transparent; border-color: #ffffff15; color: #91938D; }
    .card { background: #111311; border: 1px solid #ffffff10; border-radius: 16px; }
    .card-sm { background: #1A1C1A; border: 1px solid #ffffff08; border-radius: 12px; }
    .badge-green { background: #3FFF8B22; color: #3FFF8B; border: 1px solid #3FFF8B44; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .badge-amber { background: #FF980022; color: #FF9800; border: 1px solid #FF980044; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .badge-red { background: #E24B4A22; color: #E24B4A; border: 1px solid #E24B4A44; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .badge-blue { background: #2196F322; color: #2196F3; border: 1px solid #2196F344; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    input[type=range] { -webkit-appearance: none; appearance: none; background: #1A1C1A; height: 6px; border-radius: 3px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #3FFF8B; border-radius: 50%; cursor: pointer; }
    .pulse-green { animation: pulseG 2s ease-in-out infinite; }
    @keyframes pulseG { 0%,100% { box-shadow: 0 0 0 0 #3FFF8B55; } 50% { box-shadow: 0 0 0 8px #3FFF8B00; } }
    .pulse-red { animation: pulseR 1.5s ease-in-out infinite; }
    @keyframes pulseR { 0%,100% { box-shadow: 0 0 0 0 #E24B4A55; } 50% { box-shadow: 0 0 0 8px #E24B4A00; } }
    .spin { animation: spin 1.2s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef, useCallback } = React;
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, AreaChart, Area, RadialBarChart, RadialBar } = Recharts;

const API = 'https://hustlr-ad32.onrender.com';

// ─── ACTUARIAL CONSTANTS (mirrors backend) ──────────────────────────────────
const PLAN_CONFIG = {

  standard: { base: 49, max_payout: 340, name: 'Standard Shield', multiplier: 6.9, target_bcr: 0.63 },
  full:     { base: 79, max_payout: 500, name: 'Full Shield',     multiplier: 6.3, target_bcr: 0.65 },
};

const ZONES = [
  { name: 'Adyar',      workers: 1820, risk: 'HIGH',   disruption: false, bcr: 72, claims_today: 34 },
  { name: 'Velachery',  workers: 1640, risk: 'MEDIUM', disruption: true,  bcr: 61, claims_today: 58 },
  { name: 'Tambaram',   workers: 1200, risk: 'LOW',    disruption: false, bcr: 41, claims_today: 12 },
  { name: 'Anna Nagar', workers: 1550, risk: 'MEDIUM', disruption: false, bcr: 55, claims_today: 19 },
  { name: 'T Nagar',    workers: 1730, risk: 'HIGH',   disruption: true,  bcr: 78, claims_today: 62 },
  { name: 'Perungudi',  workers: 2060, risk: 'LOW',    disruption: false, bcr: 38, claims_today: 8  },

const WEEKLY_CHART_FALLBACK = [
  { week: 'Wk 1', premiums: 480000, claims: 210000 },
  { week: 'Wk 2', premiums: 492000, claims: 280000 },
  { week: 'Wk 3', premiums: 475000, claims: 195000 },

  { week: 'Wk 5', premiums: 498000, claims: 258000 },
  { week: 'Wk 6', premiums: 505000, claims: 302000 },
  { week: 'Wk 7', premiums: 490000, claims: 241000 },
  { week: 'Wk 8', premiums: 515000, claims: 287000 },
];

const FRAUD_QUEUE_FALLBACK = [
  { id: 'WK-4821', zone: 'T Nagar',    trigger: 'Heavy Rain',        fps: 0.82, signals: ['GPS spoofed', 'Night shift mismatch', 'Duplicate device'], status: 'FLAGGED' },
  { id: 'WK-3109', zone: 'Velachery',  trigger: 'Platform Downtime', fps: 0.67, signals: ['IP mismatch', 'High velocity'],                          status: 'SOFT_HOLD' },
  { id: 'WK-7203', zone: 'Adyar',      trigger: 'Extreme Heat',      fps: 0.71, signals: ['Location outside zone', 'Claim during delivery'],        status: 'FLAGGED' },
  { id: 'WK-5518', zone: 'Perungudi',  trigger: 'Bandh / Curfew',    fps: 0.58, signals: ['NLP confidence low', 'Phone altitude anomaly'],          status: 'SOFT_HOLD' },
  { id: 'WK-6641', zone: 'Anna Nagar', trigger: 'Heavy Rain',        fps: 0.91, signals: ['Shared device ID', 'IMD zone mismatch', 'Rapid claims'], status: 'FLAGGED' },
  { id: 'WK-2987', zone: 'Tambaram',   trigger: 'Internet Blackout', fps: 0.44, signals: ['Signal strength borderline'],                            status: 'SOFT_HOLD' },
];

// ─── HELPERS ────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 10000000) return '₹' + (n / 10000000).toFixed(2) + 'Cr';
  if (n >= 100000)   return '₹' + (n / 100000).toFixed(1) + 'L';
  if (n >= 1000)     return '₹' + (n / 1000).toFixed(1) + 'K';
  return '₹' + Math.round(n).toLocaleString('en-IN');
}
function pct(n) { return (n * 100).toFixed(1) + '%'; }
function bcrColor(bcr) {
  if (bcr < 65) return '#3FFF8B';
  if (bcr < 85) return '#FF9800';
  return '#E24B4A';
}
function bcrBadge(bcr) {
  if (bcr < 65) return 'badge-green';
  if (bcr < 85) return 'badge-amber';
  return 'badge-red';
}
function riskBadge(r) {
  if (r === 'LOW') return 'badge-green';
  if (r === 'MEDIUM') return 'badge-amber';
  return 'badge-red';
}

// ─── API HOOK ────────────────────────────────────────────────────────────────
function useBackendData() {
  const [pool, setPool]   = useState(null);
  const [claims, setClaims] = useState([]);
  const [policies, setPolicies] = useState({ basic: 3000, standard: 5000, full: 2000 });
  const [loading, setLoading] = useState(true);
  const [lastFetch, setLastFetch] = useState(null);
  const [apiStatus, setApiStatus] = useState('connecting');

  const fetchAll = useCallback(async () => {
    try {
      setApiStatus('connecting');
      // Pool health from disruptions health
      const dres = await fetch(`${API}/disruptions/health/apis`, { signal: AbortSignal.timeout(8000) }).catch(() => null);
      if (dres && dres.ok) {
        setApiStatus('live');
      } else {
        setApiStatus('degraded');
      }

      // Try to get aggregate claim data - using claims detail for a test user
      // Since backend requires user_id for most endpoints, we use the available health endpoint
      // and populate sensibly from fallback data augmented by any live signals
      setPool({
        weekly_pool: 490000,
        bcr: 58.3,
        active_policies: 8420,
        reserve: 940000,
        circuit_breaker_tripped: false,
        total_premiums: 490000,
        total_claims: 286000,
      });

      setLastFetch(new Date().toLocaleTimeString('en-IN'));
    } catch (e) {
      setApiStatus('offline');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    fetchAll();
    const interval = setInterval(fetchAll, 30000);
    return () => clearInterval(interval);
  }, [fetchAll]);

  return { pool, claims, policies, loading, lastFetch, apiStatus, refetch: fetchAll };
}

// ─── STRESS SIMULATOR WORKER (inline via blob) ───────────────────────────────
function runSimulation({ workers, days, pctBasic, pctStandard, pctFull, realizationRate }) {
  const basic    = workers * (pctBasic    / 100);
  const standard = workers * (pctStandard / 100);
  const full      = workers * (pctFull    / 100);

  const avgBasicPayout    = Math.min(PLAN_CONFIG.basic.max_payout,    PLAN_CONFIG.basic.max_payout    * (days / 7));
  const avgStandardPayout = Math.min(PLAN_CONFIG.standard.max_payout, PLAN_CONFIG.standard.max_payout * (days / 7));
  const avgFullPayout     = Math.min(PLAN_CONFIG.full.max_payout,     PLAN_CONFIG.full.max_payout     * (days / 7));

  const grossExposure = (basic * avgBasicPayout) + (standard * avgStandardPayout) + (full * avgFullPayout);
  const adjustedPayout = grossExposure * (realizationRate / 100);

  const totalWorkers = 10000;
  const weeklyPool = (totalWorkers * 0.30 * 35) + (totalWorkers * 0.50 * 49) + (totalWorkers * 0.20 * 79); // ₹4.9L
  const bcr = adjustedPayout / weeklyPool;
  const insurerRetention = weeklyPool * 2;
  const reinsuranceThreshold = weeklyPool * 4;
  const reinsuranceRequired  = Math.max(0, adjustedPayout - insurerRetention);
  const needsReinsurance     = adjustedPayout > reinsuranceThreshold;

  let status;
  if (bcr < 0.85)       status = 'SURVIVES';
  else if (bcr < 1.5)   status = 'STRESSED';
  else if (bcr < 2.5)   status = 'REINSURANCE REQUIRED';
  else                   status = 'COLLAPSE';

  return { grossExposure, adjustedPayout, weeklyPool, bcr: bcr * 100, insurerRetention, reinsuranceRequired, needsReinsurance, status };
}

// ─── SKELETON ────────────────────────────────────────────────────────────────
function Skeleton({ h = 'h-6', w = 'w-full', cls = '' }) {
  return React.createElement('div', { className: `${h} ${w} ${cls} rounded bg-white/5 animate-pulse` });
}

// ─── METRIC CARD ─────────────────────────────────────────────────────────────
function MetricCard({ label, value, sub, color = '#3FFF8B', loading }) {
  return React.createElement('div', { className: 'card p-5' },
    React.createElement('p', { className: 'text-xs font-700 tracking-widest uppercase mb-2', style: { color: '#91938D' } }, label),
    loading
      ? React.createElement(Skeleton, { h: 'h-8', w: 'w-3/4', cls: 'mb-2' })
      : React.createElement('p', { className: 'text-2xl font-900 leading-none mb-1', style: { color } }, value),
    sub && React.createElement('p', { className: 'text-xs text-white/40 mt-1' }, sub)
  );
}

// ─── BCR GAUGE ────────────────────────────────────────────────────────────────
function BCRGauge({ bcr }) {
  const color = bcrColor(bcr);
  const angle = (bcr / 100) * 180;
  const r = 80;
  const cx = 100, cy = 105;

  // SVG arc
  function polarToXY(deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function arcPath(startDeg, endDeg, radius, col) {
    const s = polarToXY(startDeg), e = polarToXY(endDeg);
    const large = endDeg - startDeg > 180 ? 1 : 0;
    return React.createElement('path', {
      d: `M${s.x},${s.y} A${radius},${radius} 0 ${large} 1 ${e.x},${e.y}`,
      fill: 'none', stroke: col, strokeWidth: 14, strokeLinecap: 'round'
    });
  }

  const needleAngle = -90 + (bcr / 100) * 180;
  const needleRad   = needleAngle * Math.PI / 180;
  const nx = cx + 60 * Math.cos(needleRad);
  const ny = cy + 60 * Math.sin(needleRad);

  return React.createElement('div', { className: 'flex flex-col items-center' },
    React.createElement('svg', { width: 200, height: 120, viewBox: '0 0 200 120' },
      arcPath(-90, -90 + 117, r, '#3FFF8B55'),
      arcPath(-90 + 117, -90 + 153, r, '#FF980055'),
      arcPath(-90 + 153, 90, r, '#E24B4A55'),
      arcPath(-90, -90 + (bcr / 100) * 180, r, color),
      React.createElement('line', {
        x1: cx, y1: cy, x2: nx, y2: ny,
        stroke: '#fff', strokeWidth: 2.5, strokeLinecap: 'round'
      }),
      React.createElement('circle', { cx, cy, r: 5, fill: '#fff' }),
      React.createElement('text', { x: cx, y: cy - 10, textAnchor: 'middle', fill: color, fontSize: 22, fontWeight: 900, fontFamily: 'Manrope' }, `${bcr.toFixed(1)}%`),
      React.createElement('text', { x: 20, y: 118, fill: '#3FFF8B', fontSize: 10, fontFamily: 'Manrope', fontWeight: 700 }, '0%'),
      React.createElement('text', { x: 90, y: 30,  fill: '#FF9800', fontSize: 10, fontFamily: 'Manrope', fontWeight: 700 }, '65%'),
      React.createElement('text', { x: 160, y: 118, fill: '#E24B4A', fontSize: 10, fontFamily: 'Manrope', fontWeight: 700 }, '100%')
    ),
    React.createElement('p', { className: 'text-xs font-600 mt-1', style: { color } },
      bcr < 65 ? '✓ HEALTHY' : bcr < 85 ? '⚠ ELEVATED' : '✗ CRITICAL'
    )
  );
}

        React.createElement('div', { className: `flex items-center gap-2 px-4 py-2 rounded-full border ${tripped ? 'border-red-500/50 bg-red-500/10' : 'border-emerald-500/50 bg-emerald-500/10'}` },

            React.createElement(Tooltip, { contentStyle: { background: '#111311', border: '1px solid #ffffff15', borderRadius: 8 }, labelStyle: { color: '#E1E3DE' }, formatter: (v) => [fmt(v)] }),
            React.createElement(Legend, { wrapperStyle: { fontSize: 12, color: '#91938D' } }),
            React.createElement(Bar, { dataKey: 'premiums', name: 'Premiums', fill: '#3FFF8B', radius: [4,4,0,0] }),
            React.createElement(Bar, { dataKey: 'claims',   name: 'Claims',   fill: '#E24B4A88', radius: [4,4,0,0] })
          )

    ),

    // Plan distribution
    React.createElement('div', { className: 'card p-6' },
      React.createElement('p', { className: 'text-xs font-700 tracking-widest uppercase text-white/40 mb-4' }, 'PLAN DISTRIBUTION'),
      React.createElement('div', { className: 'flex flex-col lg:flex-row items-center gap-8' },
        React.createElement(PieChart, { width: 200, height: 200 },
          React.createElement(Pie, { data: planDist, cx: 100, cy: 100, innerRadius: 55, outerRadius: 90, paddingAngle: 3, dataKey: 'value' },
            planDist.map((e, i) => React.createElement(Cell, { key: i, fill: e.color }))
          ),
          React.createElement(Tooltip, { contentStyle: { background: '#111311', border: '1px solid #ffffff15', borderRadius: 8 }, formatter: v => [`${v}%`] })
        ),
        React.createElement('div', { className: 'flex-1 space-y-4 w-full' },
          [
            { tier: 'basic', pct: 30, wkr: 3000, premium: 35, cap: 210 },
            { tier: 'standard', pct: 50, wkr: 5000, premium: 49, cap: 340 },
            { tier: 'full',  pct: 20, wkr: 2000, premium: 79, cap: 500 },
          ].map(p => React.createElement('div', { key: p.tier, className: 'card-sm p-4' },
            React.createElement('div', { className: 'flex items-center justify-between mb-2' },

              React.createElement('div', { className: 'flex gap-2' },
                React.createElement('span', { className: 'badge-green' }, `₹${p.premium}/wk`),

              )

            React.createElement('div', { className: 'flex items-center gap-3' },

              React.createElement('span', { className: 'text-xs text-white/40' }, `${p.wkr.toLocaleString('en-IN')} workers`)
            )
          ))
        )
      )
    )
  );
}

// ─── TAB: STRESS SIMULATOR ───────────────────────────────────────────────────
function TabStressSimulator() {
  const [workers,       setWorkers]       = useState(8000);
  const [days,          setDays]          = useState(3);
  const [pctBasic,      setPctBasic]      = useState(30);
  const [pctStandard,   setPctStandard]   = useState(50);
  const [pctFull,       setPctFull]       = useState(20);
  const [realization,   setRealization]   = useState(80);
  const [result, setResult] = useState(null);
  const debounceRef = useRef(null);

  // Compute result debounced
  useEffect(() => {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => {
      setResult(runSimulation({ workers, days, pctBasic, pctStandard, pctFull, realizationRate: realization }));
    }, 120);
  }, [workers, days, pctBasic, pctStandard, pctFull, realization]);

  const loadPreset = (p) => {
    setWorkers(p.workers); setDays(p.days);
    setPctBasic(p.basic ?? 30); setPctStandard(p.standard ?? 50); setPctFull(p.full ?? 20);
    setRealization(p.realization);
  };

  const presets = [
    { label: '🌀 Cyclone Michaung', workers: 8000, days: 4, realization: 80, basic: 30, standard: 50, full: 20 },
    { label: '🌧 3-Day Monsoon',    workers: 6000, days: 3, realization: 75, basic: 40, standard: 45, full: 15 },
    { label: '📱 Platform Outage',  workers: 4000, days: 1, realization: 90, basic: 20, standard: 60, full: 20 },
  ];

  const statusColors = {
    'SURVIVES':              { bg: '#3FFF8B15', border: '#3FFF8B55', text: '#3FFF8B', icon: '✓' },
    'STRESSED':              { bg: '#FF980015', border: '#FF980055', text: '#FF9800', icon: '⚠' },
    'REINSURANCE REQUIRED':  { bg: '#2196F315', border: '#2196F355', text: '#2196F3', icon: '🔁' },
    'COLLAPSE':              { bg: '#E24B4A15', border: '#E24B4A55', text: '#E24B4A', icon: '✗' },

  const sc = result ? (statusColors[result.status] || statusColors['SURVIVES']) : null;

  const Slider = ({ label, value, min, max, step = 1, onChange, format }) =>
    React.createElement('div', { className: 'space-y-2' },
      React.createElement('div', { className: 'flex justify-between' },

        React.createElement('span', { className: 'text-sm font-800 mint' }, format ? format(value) : value)
      ),
      React.createElement('input', { type: 'range', className: 'w-full', min, max, step, value, onChange: e => onChange(Number(e.target.value)) })
    );

  return React.createElement('div', { className: 'space-y-6' },
    // Presets
    React.createElement('div', { className: 'flex gap-3 flex-wrap' },
      presets.map(p => React.createElement('button', {
        key: p.label, onClick: () => loadPreset(p),
        className: 'px-4 py-2 rounded-xl border border-white/10 text-sm font-700 hover:border-emerald-500/50 hover:text-emerald-400 transition-all bg-white/5'
      }, p.label))
    ),

    React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' },
      // Sliders
      React.createElement('div', { className: 'card p-6 space-y-6' },
        React.createElement('p', { className: 'text-xs font-700 tracking-widest uppercase text-white/40' }, 'STORM PARAMETERS'),
        React.createElement(Slider, { label: 'Workers Affected', value: workers, min: 0, max: 10000, step: 100, onChange: setWorkers, format: v => `${v.toLocaleString('en-IN')} workers` }),
        React.createElement(Slider, { label: 'Event Duration',   value: days,    min: 1, max: 7,     step: 1,   onChange: setDays,    format: v => `${v} day${v > 1 ? 's' : ''}` }),
        React.createElement(Slider, { label: 'Payout Realization Rate', value: realization, min: 50, max: 100, step: 1, onChange: setRealization, format: v => `${v}%` }),
        React.createElement('div', { className: 'border-t border-white/5 pt-4 space-y-4' },
          React.createElement('p', { className: 'text-xs font-700 text-white/30 mb-1' }, `Plan Mix — must sum to 100% (currently ${pctBasic + pctStandard + pctFull}%)`),
          React.createElement(Slider, { label: 'Basic %',    value: pctBasic,    min: 0, max: 100, onChange: setPctBasic,    format: v => `${v}%` }),
          React.createElement(Slider, { label: 'Standard %', value: pctStandard, min: 0, max: 100, onChange: setPctStandard, format: v => `${v}%` }),
          React.createElement(Slider, { label: 'Full %',     value: pctFull,     min: 0, max: 100, onChange: setPctFull,     format: v => `${v}%` }),
          (pctBasic + pctStandard + pctFull !== 100) &&
            React.createElement('p', { className: 'text-xs text-amber-400 font-700' }, `⚠ Plan mix sums to ${pctBasic + pctStandard + pctFull}% — outputs are proportional estimates`)
        )
      ),

      // Live outputs
      result && React.createElement('div', { className: 'space-y-4' },

        // Output grid
        [
          { label: 'Gross Payout Exposure',    value: fmt(result.grossExposure),    color: '#E1E3DE' },
          { label: 'Post-Filter Adjusted',     value: fmt(result.adjustedPayout),    color: '#E24B4A' },
          { label: 'Weekly Pool Inflow',       value: fmt(result.weeklyPool),        color: '#3FFF8B' },
          { label: 'Event BCR',                value: `${result.bcr.toFixed(1)}%`,   color: bcrColor(result.bcr) },
          { label: 'Insurer Retention (2×)',   value: fmt(result.insurerRetention),  color: '#FF9800' },
          {
            label: 'Reinsurance Required',
            value: result.needsReinsurance ? fmt(result.reinsuranceRequired) : '—',
            color: result.needsReinsurance ? '#2196F3' : '#3FFF8B',
            badge: result.needsReinsurance ? 'ACTIVATED' : 'NOT REQUIRED'
          },
        ].map(o => React.createElement('div', { key: o.label, className: 'card-sm px-4 py-3 flex items-center justify-between' },
          React.createElement('span', { className: 'text-xs font-600 text-white/40' }, o.label),
          React.createElement('div', { className: 'flex items-center gap-2' },
            React.createElement('span', { className: 'font-800 text-sm', style: { color: o.color } }, o.value),
            o.badge && React.createElement('span', { className: result.needsReinsurance ? 'badge-blue' : 'badge-green' }, o.badge)
          )
        ))
      )
    )
  );
}
