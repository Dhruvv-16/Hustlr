<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hustlr 3D Risk Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #050a12; overflow: hidden; }
    #canvas { position: absolute; inset: 0; }

    /* Legend */
    #legend {
      position: absolute;
      bottom: 24px;
      left: 16px;
      background: rgba(5,10,18,0.82);
      border: 1px solid rgba(63,255,139,0.18);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      backdrop-filter: blur(12px);
    }
    #legend h4 { font-size: 11px; letter-spacing: 1.5px; color: #3fff8b; margin-bottom: 10px; font-weight: 700; }
    .leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; color: rgba(255,255,255,0.75); }
    .leg-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

    /* Top bar */
    #topbar {
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      background: rgba(5,10,18,0.82);
      border: 1px solid rgba(63,255,139,0.18);
      border-radius: 24px;
      padding: 8px 20px;
      font-family: 'Inter', system-ui, sans-serif;
      color: #3fff8b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      backdrop-filter: blur(12px);
      white-space: nowrap;
    }

    /* Tooltip */
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(5,10,18,0.92);
      border: 1px solid rgba(63,255,139,0.28);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      font-size: 12px;
      display: none;
      backdrop-filter: blur(8px);
      min-width: 160px;
    }
    #tooltip .zone-name { color: #3fff8b; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
    #tooltip .stat { color: rgba(255,255,255,0.65); margin-bottom: 3px; }
    #tooltip .stat span { color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="topbar">⬡ &nbsp;HUSTLR LIVE RISK MAP — CHENNAI</div>
  <div id="legend">
    <h4>RISK LEVEL</h4>
    <div class="leg-row"><div class="leg-swatch" style="background:#3fff8b"></div>Low (0–30)</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#ffe066"></div>Moderate (31–60)</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#ff8c42"></div>High (61–80)</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#ff3b59"></div>Critical (81–100)</div>
  </div>
  <div id="tooltip">
    <div class="zone-name" id="tt-zone"></div>
    <div class="stat">Risk score: <span id="tt-risk"></span></div>
    <div class="stat">Active claims: <span id="tt-claims"></span></div>
    <div class="stat">Trigger: <span id="tt-trigger"></span></div>
    <div class="stat">Workers online: <span id="tt-workers"></span></div>
  </div>

  <!-- Deck.gl standalone bundle — no Mapbox needed -->
  <script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

  <script>
    // ── Chennai zone seed data ─────────────────────────────────────────────
    // Each entry maps a zone name to lat/lng and risk params.
    // In production these come from Supabase `disruption_events`.
    const ZONES = [
      { name: 'Adyar',           lat: 13.0067, lng: 80.2206, risk: 87, claims: 12, trigger: 'Rain',     workers: 43 },
      { name: 'T. Nagar',        lat: 13.0418, lng: 80.2341, risk: 72, claims: 8,  trigger: 'Rain',     workers: 61 },
      { name: 'Anna Nagar',      lat: 13.0850, lng: 80.2101, risk: 55, claims: 5,  trigger: 'Heat',     workers: 34 },
      { name: 'Velachery',       lat: 12.9780, lng: 80.2209, risk: 91, claims: 18, trigger: 'Flood',    workers: 29 },
      { name: 'Porur',           lat: 13.0357, lng: 80.1566, risk: 46, claims: 3,  trigger: 'AQI',      workers: 22 },
      { name: 'Tambaram',        lat: 12.9249, lng: 80.1000, risk: 38, claims: 2,  trigger: 'Heat',     workers: 18 },
      { name: 'Sholinganallur',  lat: 12.9010, lng: 80.2279, risk: 79, claims: 9,  trigger: 'Rain',     workers: 37 },
      { name: 'Chromepet',       lat: 12.9516, lng: 80.1462, risk: 62, claims: 6,  trigger: 'Rain',     workers: 25 },
      { name: 'Mylapore',        lat: 13.0339, lng: 80.2619, risk: 83, claims: 11, trigger: 'Platform', workers: 55 },
      { name: 'Guindy',          lat: 13.0067, lng: 80.2097, risk: 70, claims: 7,  trigger: 'Heat',     workers: 48 },
      { name: 'Perambur',        lat: 13.1175, lng: 80.2446, risk: 28, claims: 1,  trigger: 'None',     workers: 15 },
      { name: 'Kolathur',        lat: 13.1196, lng: 80.2080, risk: 33, claims: 2,  trigger: 'AQI',      workers: 20 },
      { name: 'Medavakkam',      lat: 12.9173, lng: 80.1948, risk: 68, claims: 5,  trigger: 'Rain',     workers: 32 },
    ];

    const H3_RES = 8; // ~0.74 km² per hex — mirrors GigGuard's resolution

    // Build H3 hex data
    function buildHexData() {
      return ZONES.map(z => {
        const h3index = h3.latLngToCell(z.lat, z.lng, H3_RES);
        return { ...z, h3index };
      });
    }

    // Risk → RGBA colour
    function riskColor(risk, alpha = 200) {
      if (risk >= 81) return [255, 59, 89, alpha];
      if (risk >= 61) return [255, 140, 66, alpha];
      if (risk >= 31) return [255, 224, 102, alpha];
      return [63, 255, 139, alpha];
    }

    function riskColorLine(risk) {
      if (risk >= 81) return [255, 59, 89, 255];
      if (risk >= 61) return [255, 140, 66, 255];
      if (risk >= 31) return [255, 224, 102, 255];
      return [63, 255, 139, 255];
    }

    const hexData = buildHexData();
    const tooltip = document.getElementById('tooltip');

    // ── Basemap tile layer (CARTO Dark, no key required) ──────────────────
    const tileLayer = new deck.TileLayer({
      id: 'basemap',
      data: 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
      minZoom: 0,
      maxZoom: 19,
      tileSize: 256,
      renderSubLayers: props => {
        const { bbox: { west, south, east, north } } = props.tile;
        return new deck.BitmapLayer(props, {
          data: null,
          image: props.data,
          bounds: [west, south, east, north],
        });
      },
    });

    // ── H3 Hexagon layer ──────────────────────────────────────────────────
    const h3Layer = new deck.H3HexagonLayer({
      id: 'risk-hexagons',
      data: hexData,
      pickable: true,
      wireframe: false,
      filled: true,
      extruded: true,
      elevationScale: 100,

      getHexagon: d => d.h3index,
      getFillColor: d => riskColor(d.risk, 200),
      getLineColor: d => riskColorLine(d.risk),
      getElevation: d => d.risk,
      lineWidthMinPixels: 1,

      onHover: ({ object, x, y }) => {
        if (object) {
          document.getElementById('tt-zone').textContent    = object.name;
          document.getElementById('tt-risk').textContent    = object.risk;
          document.getElementById('tt-claims').textContent  = object.claims;
          document.getElementById('tt-trigger').textContent = object.trigger;
          document.getElementById('tt-workers').textContent = object.workers;
          tooltip.style.display = 'block';
          tooltip.style.left    = (x + 14) + 'px';
          tooltip.style.top     = (y - 10) + 'px';
        } else {
          tooltip.style.display = 'none';
        }
      },
    });

    // ── Render ────────────────────────────────────────────────────────────
    const deckInstance = new deck.Deck({
      canvas: 'canvas',
      initialViewState: {
        longitude: 80.2101,
        latitude:  13.0280,
        zoom:      11.2,
        pitch:     52,
        bearing:   -18,
      },
      controller: true,
      layers: [tileLayer, h3Layer],
    });

    // ── Pulse animation: oscillate elevation scale ────────────────────────
    let tick = 0;
    function animate() {
      tick += 0.02;
      const pulse = 100 + Math.sin(tick) * 12;
      deckInstance.setProps({
        layers: [
          tileLayer,
          new deck.H3HexagonLayer({
            ...h3Layer.props,
            elevationScale: pulse,
          }),
        ],
      });
      requestAnimationFrame(animate);
    }
    animate();

    // ── Flutter bridge: accept injected live data ─────────────────────────
    // Flutter can call: window.updateRiskData(jsonString)
    window.updateRiskData = function(jsonStr) {
      try {
        const incoming = JSON.parse(jsonStr);
        // Merge incoming risk scores by zone name
        incoming.forEach(update => {
          const zone = hexData.find(z => z.name === update.name);
          if (zone) { zone.risk = update.risk; zone.claims = update.claims; }
        });
      } catch(e) { console.error('updateRiskData parse error', e); }
    };
  </script>
</body>
</html>
